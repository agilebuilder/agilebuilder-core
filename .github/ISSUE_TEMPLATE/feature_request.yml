name: Feature Request
description: Propose an improvement or new capability.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the change you want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives or workarounds you evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include usage examples, constraints, or screenshots if helpful.
