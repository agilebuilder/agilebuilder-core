name: Feature request
description: Suggest an improvement for AgileBuilder Core
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or inefficient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MCP
        - Authentication
        - Workspace
        - Resources
        - Template generation
        - Packaging
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
