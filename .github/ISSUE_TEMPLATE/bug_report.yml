name: Bug report
description: Report a reproducible AgileBuilder Core issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please remove tokens, API keys, device IDs, workspace IDs, resource IDs, private paths, and internal URLs before submitting.
  - type: input
    id: version
    attributes:
      label: AgileBuilder version
      description: Run `ag --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - MCP
        - Authentication
        - Workspace
        - Resources
        - Template generation
        - Packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest set of commands or actions that reproduce the issue.
      placeholder: |
        1. Run `ag ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, package manager, shell, and whether this is local or cloud workspace.
